<!DOCTYPE html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Вартові правди: декодування пропаганди</title>
<style>
:root{--bg:#14110d;--fg:#f3e9d2;--cd:#241d14;--ac:#e8b923;--ln:#4a3d28;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root{--bg:#f4ecdc;--fg:#1f1a12;--cd:#fffaf0;--ln:#cdb98f}}
*{box-sizing:border-box}html{color-scheme:dark light}body{margin:0;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{max-width:640px;margin:0 auto;padding:10px}
h1{font-size:22px;text-align:center;margin:10px 0;color:var(--ac)}
button{font:inherit;cursor:pointer;border:2px solid var(--ac);background:var(--cd);color:var(--fg);border-radius:10px;padding:10px 14px;margin:3px}
button.p{background:var(--ac);color:#1a1408;font-weight:bold}button.on{background:var(--ac);color:#1a1408}
input{font:inherit;width:100%;padding:9px;margin:3px 0;border-radius:8px;border:1px solid var(--ln);background:var(--cd);color:var(--fg)}
.bd{position:relative;width:100%;border:3px solid var(--ac);border-radius:8px;overflow:hidden}.bd img{display:block;width:100%}
.tk{position:absolute;width:4.2%;aspect-ratio:1;border-radius:50%;border:2px solid #fff;transform:translate(-50%,-50%);transition:left .5s,top .5s;box-shadow:0 0 6px #000}
.pl{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.pc{flex:1 1 30%;padding:6px 8px;background:var(--cd);border:2px solid var(--ln);border-radius:8px;font-size:14px}.pc.cur{border-color:var(--ac)}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px}
.md{position:fixed;inset:0;background:#000d;overflow:auto;padding:12px;z-index:9}.mb{max-width:460px;margin:0 auto;background:var(--cd);border:3px solid var(--ac);border-radius:12px;padding:12px;text-align:center}.mb img{max-width:100%;border-radius:8px}
.sm{font-size:14px;opacity:.85}textarea{font:inherit;width:100%;min-height:80px;padding:9px;margin:8px 0;border-radius:8px;border:1px solid var(--ln);background:var(--bg);color:var(--fg)}.spin{width:40px;height:40px;border:4px solid var(--ln);border-top-color:var(--ac);border-radius:50%;margin:14px auto;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.die{width:68px;height:68px;margin:6px auto;background:#fff;border-radius:14px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:9px;box-shadow:0 4px 10px #0007}.die i{display:block;width:100%;height:100%;border-radius:50%}.die i.on{background:#1a1408;transform:scale(.75)}
.die.roll{animation:dieroll .38s linear infinite}@keyframes dieroll{0%{transform:rotate(0) translateY(0) scale(1)}25%{transform:rotate(90deg) translateY(-14px) scale(1.12)}50%{transform:rotate(180deg) translateY(0) scale(1)}75%{transform:rotate(270deg) translateY(-14px) scale(1.12)}100%{transform:rotate(360deg) translateY(0) scale(1)}}
.tk{z-index:1}.tk.cur{z-index:2;animation:pulse 1.3s ease-in-out infinite}@keyframes pulse{0%,100%{box-shadow:0 0 6px #000,0 0 0 0 #ffe08a}50%{box-shadow:0 0 6px #000,0 0 0 7px #ffe08a00}}
.tk.hop{animation:hop .28s ease-out}@keyframes hop{0%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-105%) scale(1.45)}100%{transform:translate(-50%,-50%) scale(1)}}
.turn{animation:slidein .5s ease-out;margin:4px 0}@keyframes slidein{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
.md{animation:fadein .25s ease-out}@keyframes fadein{from{opacity:0}to{opacity:1}}
.mb{animation:pop .38s cubic-bezier(.2,.9,.3,1.2)}@keyframes pop{from{opacity:0;transform:scale(.8) translateY(30px)}to{opacity:1;transform:none}}
.pic{animation:flip .55s ease-out}@keyframes flip{from{transform:perspective(900px) rotateY(-90deg);opacity:0}to{transform:perspective(900px) rotateY(0);opacity:1}}
@media(prefers-reduced-motion:reduce){.die.roll,.tk.cur,.tk.hop,.turn,.md,.mb,.pic{animation:none}}
.tb{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}.tb th,.tb td{border:1px solid var(--ln);padding:4px 6px;text-align:center}

body.inmenu{background:#050b14}
body.inmenu #app{max-width:none;padding:0}
.mn{container-type:inline-size;position:relative;width:100%;max-width:520px;min-height:100vh;margin:0 auto;overflow:hidden;color:#f1ede4;
 font-family:"Segoe UI",Roboto,system-ui,-apple-system,sans-serif;
 background:radial-gradient(ellipse 80% 45% at 50% 22%,#163a5a 0%,rgba(18,45,72,.0) 70%),radial-gradient(ellipse 120% 70% at 50% 60%,#0f2438 0%,#0a1726 55%,#060d17 100%)}
.mn::before{content:"";position:absolute;inset:1.4cqw;border:.3cqw solid #b98b3c;border-radius:.6cqw;pointer-events:none;z-index:2;box-shadow:inset 0 0 0 .4cqw rgba(0,0,0,.35)}
.mn .dc{position:absolute;pointer-events:none;z-index:1;display:block;height:auto}
.mn-in{position:relative;z-index:3;padding:5.2cqw 7.6cqw 6cqw;text-align:center}
.mn *{box-sizing:border-box}
.mn .stamp{display:inline-block;margin:0 0 .6cqw;padding:.3cqw 2.8cqw;border:.6cqw solid #d8262a;border-radius:1cqw;color:#e3282c;font:900 4.1cqw/1.15 "Arial Black","Segoe UI Black",Roboto,sans-serif;letter-spacing:.3cqw;transform:rotate(-3deg);background:rgba(10,4,4,.35);text-shadow:0 0 .2cqw #000}
.mn .ttl{margin:0;font:900 11.4cqw/0.92 "Arial Black","Segoe UI Black","Roboto Black",Roboto,sans-serif;letter-spacing:-.2cqw}
.mn .ttl span{display:block;color:#fff;text-shadow:0 .5cqw .8cqw rgba(0,0,0,.75)}
.mn .ttl b{display:block;color:#f8bb0f;background:linear-gradient(180deg,#ffe066 0%,#f8bb0f 55%,#e08e00 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 .5cqw .6cqw rgba(0,0,0,.8))}
.mn .subt{display:flex;align-items:center;gap:2cqw;justify-content:center;margin:1.2cqw 0 1.8cqw}
.mn .subt i{flex:1;max-width:14cqw;height:.3cqw;background:linear-gradient(90deg,transparent,#c9a24f)}
.mn .subt i:last-child{background:linear-gradient(90deg,#c9a24f,transparent)}
.mn .subt span{font:800 4.1cqw/1 "Segoe UI",Roboto,sans-serif;color:#d9d9de;letter-spacing:.1cqw}
.mn .desc{margin:0 auto 4.4cqw;font-size:3.2cqw;line-height:1.38;color:#e9e6df;max-width:90cqw}
.mn .tiles{display:grid;grid-template-columns:1fr 1fr;gap:2.4cqw 2.2cqw;margin:0 0 3cqw}
.mn .tile{position:relative;display:grid;grid-template-columns:12.5cqw 1fr;align-items:center;min-height:16.6cqw;padding:2cqw 2cqw 2cqw 1.6cqw;border-radius:2.4cqw;border:.4cqw solid #ffd76a;
 box-shadow:0 0 1.6cqw rgba(255,190,50,.55),inset 0 0 2.2cqw rgba(0,0,0,.35);text-align:left}
.mn .tile svg{width:9.4cqw;height:9.4cqw;justify-self:center}
.mn .tile h4{margin:0 0 1.2cqw;font:800 4.35cqw/1.08 "Segoe UI",Roboto,sans-serif;color:#fff;text-shadow:0 .2cqw .4cqw rgba(0,0,0,.6)}
.mn .tile .tok{display:inline-block;padding:.7cqw 2.6cqw;border-radius:1cqw;background:linear-gradient(180deg,#fbf0d4,#e7d2a1);color:#2a1d08;font:800 3.3cqw/1.1 "Segoe UI",Roboto,sans-serif;box-shadow:0 .2cqw .5cqw rgba(0,0,0,.45);clip-path:polygon(2% 8%,98% 0,100% 90%,1% 100%)}
.mn .tile.R{background:radial-gradient(ellipse at 30% 30%,#e0392c,#a8170f 60%,#6f0c07)}
.mn .tile.Y{background:radial-gradient(ellipse at 30% 30%,#ffd84a,#f3ab12 60%,#c97c03)}
.mn .tile.Y h4{color:#1b1204;text-shadow:none}
.mn .tile.K{background:radial-gradient(ellipse at 30% 30%,#3a3a3a,#161616 65%,#050505)}
.mn .tile.U{background:radial-gradient(ellipse at 30% 30%,#3b8cf2,#145ccc 60%,#0a378a)}
.mn .note{margin:0 auto 3cqw;padding:1.4cqw 3cqw;border:.3cqw solid #c9a24f;border-radius:5cqw;background:rgba(4,10,18,.75);font-size:2.75cqw;color:#e6e2da;max-width:84cqw;white-space:nowrap;
 clip-path:polygon(0 50%,3% 0,97% 0,100% 50%,97% 100%,3% 100%)}
.mn .rib{display:block;width:max-content;max-width:100%;margin:0 0 2.2cqw 1cqw;padding:1.2cqw 5cqw 1cqw 4cqw;background:linear-gradient(180deg,#f2e2b8,#d9c08a);color:#1e170c;
 font:900 4.1cqw/1 "Arial Black","Segoe UI Black",Roboto,sans-serif;letter-spacing:.2cqw;text-transform:uppercase;text-align:left;
 clip-path:polygon(0 12%,4% 0,30% 8%,60% 0,96% 6%,100% 30%,97% 60%,100% 92%,70% 100%,40% 92%,8% 100%,2% 85%,4% 50%);filter:drop-shadow(0 .3cqw .4cqw #000)}
.mn .row{position:relative;display:flex;align-items:center;gap:2cqw;margin:0 0 1.3cqw 2.4cqw}
.mn .row .pd{flex:0 0 5cqw;height:5cqw;border-radius:50%;box-shadow:inset -.6cqw -.8cqw 1cqw rgba(0,0,0,.45),inset .5cqw .5cqw .8cqw rgba(255,255,255,.55),0 0 .8cqw rgba(0,0,0,.6)}
.mn .row input{flex:1;margin:0;height:6.2cqw;padding:0 7cqw 0 3.4cqw;border-radius:1.4cqw;border:.25cqw solid #c99b4d;background:#111c28;color:#fff;font:500 3.4cqw "Segoe UI",Roboto,sans-serif}
.mn .row input:focus{outline:none;border-color:#ffd24a;box-shadow:0 0 1cqw rgba(255,200,60,.5)}
.mn .row .rm{position:absolute;right:1cqw;top:50%;transform:translateY(-50%);margin:0;padding:0;width:5cqw;height:5cqw;border:0;background:none;color:#8f98a3;font-size:4cqw;line-height:1}
.mn .add{display:block;width:calc(100% - 2.4cqw);margin:1.4cqw 0 3.4cqw 2.4cqw;height:7.8cqw;padding:0;border-radius:2cqw;border:.3cqw solid #fff0a8;
 background:linear-gradient(180deg,#ffe46f,#f6c018 55%,#e8a00a);color:#2a1a02;font:800 3.6cqw "Segoe UI",Roboto,sans-serif;box-shadow:0 0 1.4cqw rgba(255,196,40,.45)}
.mn .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:2.1cqw;margin:0 1.2cqw 3.2cqw 2.4cqw}
.mn .seg.seg2{grid-template-columns:1fr 1fr}
.mn .seg button{margin:0;height:8.3cqw;padding:0 1cqw;border-radius:2cqw;border:.3cqw solid #c99b4d;background:linear-gradient(180deg,#16212d,#0b131c);color:#f2efe8;font:600 3.6cqw "Segoe UI",Roboto,sans-serif;box-shadow:inset 0 0 1cqw rgba(0,0,0,.6)}
.mn .seg button.on{border-color:#fff0a8;background:linear-gradient(180deg,#ffe46f,#f6c018 55%,#e8a00a);color:#1e1300;font-weight:800;box-shadow:0 0 1.8cqw rgba(255,196,40,.6)}
.mn .cmn:empty{display:none}
.mn .cmn{margin:-1.6cqw 1.2cqw 3cqw 2.4cqw;font-size:2.8cqw;line-height:1.4;color:#cfd3d9;text-align:left}
.mn .cmn b{color:#ffd24a}
.mn .go{display:flex;align-items:center;justify-content:center;gap:2.4cqw;width:67cqw;max-width:100%;height:13.5cqw;margin:1cqw auto 2cqw;padding:0;border-radius:7cqw;border:.5cqw solid #fff3b0;
 background:linear-gradient(180deg,#fff08a 0%,#ffd21f 45%,#f0a90b 100%);color:#16110a;font:900 6.4cqw/1 "Arial Black","Segoe UI Black",Roboto,sans-serif;box-shadow:0 0 2.6cqw rgba(255,200,40,.75),inset 0 -1cqw 1.4cqw rgba(160,80,0,.35),inset 0 .8cqw 1cqw rgba(255,255,255,.55)}
.mn .go i{width:0;height:0;border-left:4.6cqw solid #16110a;border-top:2.8cqw solid transparent;border-bottom:2.8cqw solid transparent;font-style:normal}
.mn .go:active,.mn .add:active,.mn .seg button:active{transform:translateY(.3cqw)}
.tmr{margin:4px 0;font-weight:bold;font-variant-numeric:tabular-nums}.tmr.low{color:#e53935}
/* ── шрифт ── */
body,button,input,textarea,select,.mn,.mn *{font-family:'Oswald','Arial Narrow',sans-serif!important;letter-spacing:.01em}
body{font-weight:400}h3{font-weight:600}b,.p{font-weight:600}
.mn .ttl{font-weight:700!important;letter-spacing:0!important;font-size:13cqw!important;line-height:1.08!important;margin:0 0 3cqw!important}
.mn .ttl b{padding-top:.06em}
.mn .stamp,.mn .rib,.mn .go{font-weight:700!important}
/* ── картки гравців ── */
.pc{display:flex;flex-direction:column;gap:3px}
.pc .pn{display:flex;align-items:center;gap:7px;font-size:16px}

 setTimeout(step,330)};step()}
