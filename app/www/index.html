<div class="mn-in"><div class="stamp">ЦІЛКОМ ТАЄМНО<\/div><h1 class="ttl"><span>Вартові<\/span><b>правди<\/b><\/h1>
<div class="subt"><i><\/i><span>Декодування пропаганди<\/span><i><\/i><\/div>
<p class="desc">Ви — незалежні дослідники. Кидайте кубик, пройдіть 32 сектори від Паризької мирної конференції 1919 року до Маяка Вартових та розкривайте маніпуляції.<\/p>
<div class="tiles">${TILES.map(t=>`<div class="tile ${t[0]}">${ICO[t[0]]}<div><h4>${t[1]}<\/h4><span class="tok">${t[2]}<\/span><\/div><\/div>`).join('')}<\/div>
<div class="note">Помилка на 🖤 — маркер маніпуляції і пропуск ходу.<\/div>
<div class="rib">Гравці / команди<\/div>
${names.map((n,i)=>`<div class="row"><span class="pd" style="background:${C[i]}"><\/span><input id="n${i}" maxlength="20" value="${esc(n)}" aria-label="Гравець ${i+1}">${N>1?`<button class="rm" title="Прибрати" onclick="delP(${i})">×<\/button>`:''}<\/div>`).join('')}
${N<6?'<button class="add" onclick="addP()">+ Додати гравця<\/button>':'<div style="height:3cqw"><\/div>'}
<div class="rib">Час гри<\/div>
<div class="seg">${[[40,'40 хв'],[45,'45 хв'],[0,'Без ліміту']].map(t=>`<button class="${TL==t[0]?'on':''}" onclick="keep();TL=${t[0]};setup()">${t[1]}<\/button>`).join('')}<\/div>
<div class="rib">Перевірка відповідей<\/div>
<div class="seg seg2">${[['manual','Вручну'],['ai','ШІ Gemini']].map(t=>`<button class="${CM==t[0]?'on':''}" onclick="keep();CM='${t[0]}';setup()">${t[1]}<\/button>`).join('')}<\/div>
<p class="cmn" id="cmn">${cmNote()}<\/p>
<button class="go" onclick="start()"><i><\/i>Розпочати гру<\/button><\/div><\/div>`;
if(CM==='ai')aiStatus(true)}
function keep(){const ins=document.querySelectorAll('.mn .row input');if(ins.length)names=Array.from(ins,(e,i)=>e.value.trim()||'Команда '+(i+1))}
function addP(){keep();if(names.length<6)names.push('Команда '+(names.length+1));setup();const e=document.getElementById('n'+(names.length-1));if(e)e.select()}
function delP(i){keep();if(names.length>1)names.splice(i,1);setup()}
function cmNote(){if(CM==='manual')return 'Усю гру відповіді оцінює ведучий за зворотним боком картки.';
 const bad=' Перевірка ШІ зараз не працюватиме — оберіть «Вручну» або спробуйте пізніше.';
 if(!AI_URL)return '⚠ Сервер перевірки не підключено.'+bad;
 if(!navigator.onLine)return '⚠ Немає інтернету.'+bad;
 if(!AIS)return 'Усю гру відповіді оцінює лише Gemini за еталоном картки. Перевіряю доступність…';
 if(AIS.err)return '⚠ Сервер перевірки не відповідає.'+bad;
 return AIS.ai?`Усю гру відповіді оцінює лише Gemini за еталоном картки — без ручної зміни балів. <b>Доступно ще ~${Math.min(AIS.left,AIS.deviceLeft)} перевірок сьогодні.<\/b>`
  :`⚠ Денний ліміт ШІ-перевірок вичерпано (оновиться приблизно через ${Math.ceil(AIS.resetInMin/60)} год).`+bad}
async function aiStatus(paint){if(!AI_URL||!navigator.onLine){AIS=null;return}
 if(AIS&&Date.now()-AIS.t<30000){if(paint)paintNote();return}
 try{const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),8000);const r=await fetch(AI_URL+'/status',{signal:ac.signal});clearTimeout(tm);AIS=Object.assign(await r.json(),{t:Date.now()})}
 catch(e){AIS={err:true,t:Date.now()}}if(paint)paintNote()}
function paintNote(){const e=document.getElementById('cmn');if(e)e.innerHTML=cmNote()}
addEventListener('online',()=>{AIS=null;if(CM==='ai')aiStatus(true)});addEventListener('offline',paintNote);
function start(){keep();document.body.classList.remove('inmenu');G={pl:names.map((n,i)=>({n:n||'Команда '+(i+1),c:C[i],pos:0,tr:0,mk:0,sk:false})),cur:0,deck:{},ix:{},msg:'Кидайте кубик!',busy:false,log:[],timeUp:false,end:TL?Date.now()+TL*6e4:0};
for(const k in D){G.deck[k]=sh(D[k]);G.ix[k]=0}render();if(G.end)startTimer()}
function newGame(){stopTimer();closeMd();G=null;setup();scrollTo(0,0)}
/* ── таймер гри ── */
function tLeft(){const s=Math.max(0,Math.ceil((G.end-Date.now())/1e3));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function startTimer(){stopTimer();TMR=setInterval(tick,1000);tick()}
function stopTimer(){if(TMR)clearInterval(TMR);TMR=null}
function tick(){if(!G||!G.end)return stopTimer();const ms=G.end-Date.now(),e=document.getElementById('tmr');
 if(ms<=0){stopTimer();G.timeUp=true;if(e)e.textContent='⏱ Час вийшов!';
  if(!document.getElementById('md')&&!G.busy)fin();else{G.msg='Час вийшов! Завершіть поточну відповідь — далі підсумки.';updateMsg()}return}
 if(e){e.textContent='⏱ '+tLeft();e.classList.toggle('low',ms<=3e5)}}
/* ── картка і перевірка ── */
function showCard(){const cd=G.cd;
modal(G.head+pic(cd,'f')+(CM==='manual'?`<p><button class="p" onclick="ans()">Показати відповідь<\/button><\/p>`:`<textarea id="ans" placeholder="Введіть відповідь гравця…">${esc(G.last||'')}<\/textarea><p><button class="p" onclick="check()">Перевірити відповідь<\/button><\/p>`))}
const b64=bl=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(bl)});
async function aiCheck(cd,k,txt){
 if(!AI_URL)return {ok:false,message:'Сервер перевірки ще не підключено.'};
 if(!navigator.onLine)return {ok:false,message:'Немає інтернету.'};
 let img=null;try{img=await b64(await cellBlob(cd,'b'))}catch(e){}
 try{const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),40000);
  const r=await fetch(AI_URL+'/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({d:k,n:cd.n,a:txt,img}),signal:ac.signal});clearTimeout(tm);
  const j=await r.json();AIS=null;return j.ok?j:{ok:false,message:j.message||'Автоматична перевірка зараз недоступна.'}}
 catch(e){return {ok:false,message:'Немає зв’язку із сервером перевірки.'}}}
async function check(){const ta=document.getElementById('ans'),txt=((ta&&ta.value)||'').trim();if(!txt){if(ta)ta.focus();return}
const cd=G.cd,k=G.k;G.last=txt;
modal('<h3>Перевіряю відповідь…<\/h3><div class="spin"><\/div><p class="sm">Gemini звіряє відповідь з еталоном і системою балів картки<\/p>');
const r=await aiCheck(cd,k,txt);
if(!r.ok){G.auto=null;modal(`<h3>Не вдалося перевірити<\/h3><p class="sm">${esc(r.message)}<\/p><p><b>Відповідь гравця:<\/b><br>${esc(txt)}<\/p><button class="p" onclick="showCard()">Спробувати ще раз<\/button><button onclick="skipCard()">Пропустити картку<\/button>`);return}
G.last='';G.auto={pts:r.points,mx:r.max,fb:r.feedback,hit:r.matched,miss:r.missing,src:'Перевірено: '+(MODEL_NAMES[r.model]||'Gemini')};showRes()}
function skipCard(){G.last='';G.msg=G.pl[G.cur].n+': картку пропущено (перевірка недоступна)';next()}
function showRes(){const a=G.auto,cd=G.cd;
const li=(t,x)=>x&&x.length?`<p class="sm"><b>${t}<\/b> ${x.map(esc).join('; ')}<\/p>`:'';
modal(`<h3>Результат: ${a.pts} з ${a.mx}${a.pts==0&&G.k=='K'?' · Помилка':''}${G.sp=='D'?' (×2 за сектор)':''}<\/h3><p>${esc(a.fb)}<\/p>${li('✔ Зараховано:',a.hit)}${li('✘ Бракує:',a.miss)}${pic(cd,'b')}<p><button class="p" onclick="accept()">Далі<\/button><\/p><p class="sm" style="opacity:.6">${esc(a.src||'')}<\/p>`)}

setup();
</script></body></html>
