name: Android emulator test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Build APK
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor '#0a1726' --splashBackgroundColor '#0a1726'
          npx cap sync android
          sed -i 's/<application/<application android:largeHeap="true"/' android/app/src/main/AndroidManifest.xml
          grep -c largeHeap android/app/src/main/AndroidManifest.xml
          cd android && ./gradlew assembleDebug --no-daemon -q
          grep -E "minSdkVersion|targetSdkVersion|compileSdkVersion" variables.gradle || true
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          ram-size: 3072M
          disable-animations: true
          working-directory: app
          script: bash ../.github/emu-test.sh
