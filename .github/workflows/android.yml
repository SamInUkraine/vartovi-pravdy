name: Android APK

on:
  push:
    paths: ["app/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Встановити Capacitor
        run: npm install --no-audit --no-fund

      - name: Створити Android-проєкт
        run: |
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor '#0a1726' --splashBackgroundColor '#0a1726'
          npx cap sync android

      - name: Номер версії
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"$/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Зібрати APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: vartovi-pravdy-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
